        <path d="M55.0,91.02 L63.8,77.69999999999999 L46.199999999999996,77.69999999999999 Z" fill="#e1dfcf" opacity="0.41250000000000003"/>
        <path d="M19.8,55.5 L33.0,64.38 L33.0,46.62 Z" fill="#e1dfcf" opacity="0.41250000000000003"/>
        <path d="M90.19999999999999,55.5 L77.0,64.38 L77.0,46.62 Z" fill="#e1dfcf" opacity="0.41250000000000003"/>
        </g>
</svg>
